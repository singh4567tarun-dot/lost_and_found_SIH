<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost and Found Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2430;
    --slate: #46536b;
    --mist: #eef1f6;
    --line: #dde3ec;
    --teal: #0f6d66;
    --teal-dark: #0b524d;
    --amber: #e08a2c;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--mist);
  }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0 0 8px; }

  /* Navbar */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--teal-dark); color: var(--white);
    padding: 14px 24px; flex-wrap: wrap; gap: 10px;
  }
  nav .brand { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.2rem; }
  nav .links { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: transparent; border: 1px solid rgba(255,255,255,0.3);
    color: var(--white); padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 0.9rem; font-family: inherit;
  }
  nav button:hover { background: rgba(255,255,255,0.12); }
  nav button.active { background: var(--amber); border-color: var(--amber); font-weight: 600; }

  main { max-width: 800px; margin: 0 auto; padding: 30px 20px 60px; }
  section { display: none; }
  section.active { display: block; }

  .card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }

  input, select, textarea {
    width: 100%; padding: 10px; margin: 6px 0 14px;
    border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; font-size: 0.95rem;
  }
  label { font-weight: 600; font-size: 0.85rem; color: var(--slate); }

  button.primary {
    background: var(--teal); color: var(--white); border: none;
    padding: 12px 20px; border-radius: 6px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; width: 100%;
  }
  button.primary:hover { background: var(--teal-dark); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  #status { font-weight: 600; margin: 10px 0; min-height: 20px; }
  .success { color: var(--teal); }
  .error { color: #c0392b; }

  .item-card { display: flex; gap: 14px; }
  .item-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; background: var(--mist); }
  .item-card .meta { flex: 1; }
  .tag {
    display: inline-block; font-size: 0.75rem; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tag.lost { background: #fdecec; color: #c0392b; }
  .tag.found { background: #e7f5ee; color: var(--teal-dark); }

  .empty-state { text-align: center; color: var(--slate); padding: 30px 0; }
</style>
</head>
<body>

<nav>
  <div class="brand">🔎 Lost &amp; Found Network</div>
  <div class="links">
    <button data-page="home" class="active">Home</button>
    <button data-page="report">Report Item</button>
    <button data-page="browse">Browse</button>
    <button data-page="myreports">My Reports</button>
    <button data-page="auth" id="authNavBtn">Login / Sign Up</button>
    <button id="logoutBtn" style="display:none;">Log Out</button>
  </div>
</nav>

<main>

  <!-- HOME -->
  <section id="home" class="active">
    <div class="card">
      <h1>Reconnect people with what they've lost.</h1>
      <p>Report a lost item, report something you found, and let the network do the matching. Use the nav above to get started.</p>
      <p id="whoami" style="color: var(--slate); font-size: 0.9rem;">Not logged in yet.</p>
    </div>
  </section>

  <!-- AUTH -->
  <section id="auth">
    <div class="card">
      <h2>Login / Sign Up</h2>
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="6+ characters">
      <div style="display:flex; gap:10px;">
        <button class="primary" id="signupBtn">Sign Up</button>
        <button class="primary" id="loginBtn" style="background: var(--slate);">Log In</button>
      </div>
      <div id="authStatus"></div>
    </div>
  </section>

  <!-- REPORT ITEM -->
  <section id="report">
    <div class="card">
      <h2>Report an Item</h2>
      <label>Type</label>
      <select id="itemType">
        <option value="lost">Lost — I lost something</option>
        <option value="found">Found — I found something</option>
      </select>

      <label>Photo</label>
      <input type="file" id="itemImage" accept="image/*">

      <label>Category</label>
      <input type="text" id="itemCategory" placeholder="e.g. Backpack, Phone, Wallet, ID Card">

      <label>Colour</label>
      <input type="text" id="itemColour" placeholder="e.g. Black, Navy Blue">

      <label>Size</label>
      <input type="text" id="itemSize" placeholder="e.g. Small, Medium, Large">

      <label>Location</label>
      <input type="text" id="itemLocation" placeholder="e.g. Library, Main Gate, Hostel Block C">

      <label>Description</label>
      <textarea id="itemDescription" rows="3" placeholder="Any extra details that could help identify it"></textarea>

      <button class="primary" id="submitItemBtn">Submit Report</button>
      <div id="reportStatus"></div>
    </div>
  </section>

  <!-- BROWSE -->
  <section id="browse">
    <h2>All Reported Items</h2>
    <div id="itemsList"></div>
  </section>

  <!-- MY REPORTS -->
  <section id="myreports">
    <h2>My Reports</h2>
    <div id="myItemsList"></div>
  </section>

</main>

<div id="toast" style="display:none; position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:12px 18px; border-radius:8px; display:flex; align-items:center; gap:16px; box-shadow:0 4px 16px rgba(0,0,0,0.25); z-index:100;">
  <span id="toastMessage" style="font-size:0.9rem;"></span>
  <button id="toastUndoBtn" style="width:auto; padding:6px 14px; font-size:0.85rem; background:var(--amber); color:white; border:none; border-radius:5px; cursor:pointer; font-weight:600;">Undo</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---- Your real project config ----
  const firebaseConfig = {
    apiKey: "AIzaSyC0gvOL_KFAbrFrcSRxOs42CRydQ56Wu8s",
    authDomain: "lost-and-found-b577c.firebaseapp.com",
    projectId: "lost-and-found-b577c",
    storageBucket: "lost-and-found-b577c.firebasestorage.app",
    messagingSenderId: "485396590412",
    appId: "1:485396590412:web:765fb5bbd1c2833a5ee9e9"
  };
  const CLOUD_NAME = "rxkwngik";
  const UPLOAD_PRESET = "lostfound_unsigned";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const itemsRef = collection(db, "items");

  let currentUser = null;

  // ---------- NAVIGATION ----------
  const navButtons = document.querySelectorAll("nav button[data-page]");
  const sections = document.querySelectorAll("main section");

  function showPage(pageId) {
    sections.forEach(s => s.classList.toggle("active", s.id === pageId));
    navButtons.forEach(b => b.classList.toggle("active", b.dataset.page === pageId));
  }
  navButtons.forEach(btn => {
    btn.addEventListener("click", () => showPage(btn.dataset.page));
  });

  // ---------- AUTH ----------
  const authEmail = document.getElementById("authEmail");
  const authPassword = document.getElementById("authPassword");
  const authStatus = document.getElementById("authStatus");
  const authNavBtn = document.getElementById("authNavBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const whoami = document.getElementById("whoami");

  document.getElementById("signupBtn").addEventListener("click", async () => {
    try {
      await createUserWithEmailAndPassword(auth, authEmail.value, authPassword.value);
      authStatus.textContent = "Account created — you're logged in.";
      authStatus.className = "success";
    } catch (err) {
      authStatus.textContent = "Error: " + err.message;
      authStatus.className = "error";
    }
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      await signInWithEmailAndPassword(auth, authEmail.value, authPassword.value);
      authStatus.textContent = "Logged in.";
      authStatus.className = "success";
    } catch (err) {
      authStatus.textContent = "Error: " + err.message;
      authStatus.className = "error";
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    showPage("home");
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      whoami.textContent = "Logged in as: " + user.email;
      authNavBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
    } else {
      whoami.textContent = "Not logged in yet.";
      authNavBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
    }
    if (typeof renderMyReports === "function") renderMyReports();
  });

  // ---------- REPORT ITEM (Cloudinary + Firestore) ----------
  async function uploadImage(file) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: "POST", body: formData
    });
    if (!res.ok) throw new Error("Image upload failed");
    const data = await res.json();
    return data.secure_url;
  }

  const reportStatus = document.getElementById("reportStatus");
  const submitItemBtn = document.getElementById("submitItemBtn");

  submitItemBtn.addEventListener("click", async () => {
    if (!currentUser) {
      reportStatus.textContent = "Please log in first (see Login / Sign Up).";
      reportStatus.className = "error";
      showPage("auth");
      return;
    }

    const type = document.getElementById("itemType").value;
    const category = document.getElementById("itemCategory").value.trim();
    const colour = document.getElementById("itemColour").value.trim();
    const size = document.getElementById("itemSize").value.trim();
    const location = document.getElementById("itemLocation").value.trim();
    const description = document.getElementById("itemDescription").value.trim();
    const imageFile = document.getElementById("itemImage").files[0];

    if (!category || !location) {
      reportStatus.textContent = "Category and location are required.";
      reportStatus.className = "error";
      return;
    }

    submitItemBtn.disabled = true;
    reportStatus.textContent = "Submitting...";
    reportStatus.className = "";

    try {
      let imageUrl = "";
      if (imageFile) {
        imageUrl = await uploadImage(imageFile);
      }

      await addDoc(itemsRef, {
        type, category, colour, size, location, description,
        image: imageUrl,
        ownerUid: currentUser.uid,
        ownerEmail: currentUser.email,
        status: "open",
        createdAt: serverTimestamp()
      });

      reportStatus.textContent = "Item reported successfully!";
      reportStatus.className = "success";
      document.getElementById("itemCategory").value = "";
      document.getElementById("itemColour").value = "";
      document.getElementById("itemSize").value = "";
      document.getElementById("itemLocation").value = "";
      document.getElementById("itemDescription").value = "";
      document.getElementById("itemImage").value = "";
    } catch (err) {
      reportStatus.textContent = "Error: " + err.message;
      reportStatus.className = "error";
    } finally {
      submitItemBtn.disabled = false;
    }
  });

  // ---------- BROWSE (live list) + shared item cache ----------
  const itemsList = document.getElementById("itemsList");
  const myItemsList = document.getElementById("myItemsList");
  let allItems = []; // every item, kept in memory so we can compute matches locally

  function itemCardHtml(id, d, extraHtml = "", showDelete = false) {
    return `
      <div class="card item-card" style="flex-wrap:wrap;">
        <img src="${d.image || ''}" alt="">
        <div class="meta">
          <span class="tag ${d.type}">${d.type}</span>
          <h3>${d.category}</h3>
          <p style="margin:2px 0; color: var(--slate); font-size:0.9rem;">
            ${d.colour ? d.colour + " · " : ""}${d.size ? d.size + " · " : ""}${d.location}
          </p>
          <p style="margin:2px 0; font-size:0.9rem;">${d.description || ""}</p>
          ${showDelete ? `<button class="delete-btn" data-id="${id}" data-category="${d.category}" style="width:auto; margin-top:8px; padding:6px 12px; font-size:0.8rem; background:#fdecec; color:#c0392b; border:1px solid #f5c6c6; border-radius:5px; cursor:pointer;">Delete Report</button>` : ""}
        </div>
        ${extraHtml}
      </div>
    `;
  }

  onSnapshot(itemsRef, (snapshot) => {
    allItems = [];
    snapshot.forEach((doc) => allItems.push({ id: doc.id, ...doc.data() }));

    // Render Browse
    if (allItems.length === 0) {
      itemsList.innerHTML = '<div class="empty-state">No items reported yet. Be the first.</div>';
    } else {
      itemsList.innerHTML = allItems.map(d => itemCardHtml(d.id, d)).join("");
    }

    renderMyReports();
  });

  // ---------- MATCHING ----------
  // This formula decides how well a lost item matches a found item.
  // Update the point values below once your ML teammates tell you
  // which factors matter most (out of 100).
  function computeMatchScore(lost, found) {
    let score = 0;
    if (lost.category && lost.category.toLowerCase() === found.category.toLowerCase()) score += 40;
    if (lost.colour && found.colour && lost.colour.toLowerCase() === found.colour.toLowerCase()) score += 25;
    if (lost.location && found.location && lost.location.toLowerCase() === found.location.toLowerCase()) score += 20;
    const lostWords = (lost.description || "").toLowerCase().split(/\W+/).filter(Boolean);
    const foundWords = (found.description || "").toLowerCase().split(/\W+/).filter(Boolean);
    const overlap = lostWords.filter(w => foundWords.includes(w));
    if (overlap.length > 0) score += Math.min(15, overlap.length * 5);
    return score;
  }

  // ---------- MY REPORTS + Possible Matches + Contact reveal + Delete/Undo ----------
  const pendingDeletes = {}; // itemId -> timeoutId, items in here are hidden but not yet deleted
  const toast = document.getElementById("toast");
  const toastMessage = document.getElementById("toastMessage");
  const toastUndoBtn = document.getElementById("toastUndoBtn");
  let toastTargetId = null;

  function startDelete(id, label) {
    // Hide immediately from the UI without touching Firestore yet
    renderMyReports();

    toastTargetId = id;
    toastMessage.textContent = `"${label}" deleted.`;
    toast.style.display = "flex";

    pendingDeletes[id] = setTimeout(async () => {
      toast.style.display = "none";
      try {
        await deleteDoc(doc(db, "items", id));
      } catch (err) {
        alert("Couldn't delete: " + err.message);
      }
      delete pendingDeletes[id];
    }, 5000);
  }

  toastUndoBtn.addEventListener("click", () => {
    if (toastTargetId && pendingDeletes[toastTargetId]) {
      clearTimeout(pendingDeletes[toastTargetId]);
      delete pendingDeletes[toastTargetId];
    }
    toast.style.display = "none";
    renderMyReports();
  });

  function renderMyReports() {
    if (!currentUser) {
      myItemsList.innerHTML = '<div class="empty-state">Log in to see your reports.</div>';
      return;
    }

    const mine = allItems.filter(d => d.ownerUid === currentUser.uid && !pendingDeletes[d.id]);
    if (mine.length === 0) {
      myItemsList.innerHTML = '<div class="empty-state">You haven\'t reported anything yet.</div>';
      return;
    }

    myItemsList.innerHTML = mine.map(item => {
      let extraHtml = "";

      if (item.type === "lost") {
        const candidates = allItems
          .filter(d => d.type === "found" && d.ownerUid !== currentUser.uid)
          .map(d => ({ ...d, score: computeMatchScore(item, d) }))
          .filter(d => d.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3);

        if (candidates.length > 0) {
          extraHtml = `
            <div style="width:100%; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">
              <strong style="font-size:0.85rem; color: var(--slate);">Possible Matches</strong>
              ${candidates.map(c => `
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px; padding:8px; background:var(--mist); border-radius:6px;">
                  <span style="font-size:0.85rem;">${c.category} — ${c.location} <strong>(${c.score}% match)</strong></span>
                  <button class="contact-btn" data-email="${c.ownerEmail}" style="width:auto; padding:6px 10px; font-size:0.8rem; background:var(--amber); color:white; border:none; border-radius:5px; cursor:pointer;">Contact Finder</button>
                </div>
              `).join("")}
            </div>
          `;
        } else {
          extraHtml = `<p style="width:100%; margin-top:10px; font-size:0.85rem; color:var(--slate);">No matches yet — check back later.</p>`;
        }
      }

      return itemCardHtml(item.id, item, extraHtml, true);
    }).join("");

    // Wire up Delete buttons (soft delete — 5 second undo window)
    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        startDelete(btn.dataset.id, btn.dataset.category);
      });
    });

    // Wire up Contact buttons (reveal the finder's email on click)
    document.querySelectorAll(".contact-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.textContent = btn.dataset.email;
        btn.style.background = "var(--teal)";
      });
    });
  }
</script>

</body>
</html>
